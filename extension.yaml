manifest_version: 2
lifecycle: {data_schema_version: 1, data_migrations: []}
extension_id: flowsteward.outgoing-email
kind: notification_provider
version: 0.3.3
display_name: Outgoing Email
description: |-
  Outgoing Email sends workflow messages and project notifications through your own SMTP server. Compose plain-text or HTML email, or choose a saved project template and fill its variables from workflow data. Add To, CC and BCC recipients, and attach supported files produced or retrieved earlier in the workflow. Each send returns a message identifier plus recipient and attachment counts.

  Email a generated report, distribute completed documents, announce a successful run or notify a team when a workflow fails or awaits approval. Notification messages include the workflow and step context where available, helping recipients locate the relevant run. Reusable templates keep recurring messages consistent while letting each workflow supply its own details.

  Create a project connection with the SMTP host, supported port, SSL or STARTTLS mode and sender address. Add authentication credentials when required by your mail service, then select that connection in workflow steps or notification routes. This extension provides outbound email; reading replies requires a separate mailbox connector. Each message supports up to 10 recipients and a total encoded size of 25 MiB, or a lower configured limit. Attachment file-type restrictions apply.
vendor:
  name: Flow Steward
  support_url: https://github.com/Flow-Steward/ext-email-smtp/issues
  website_url: https://github.com/Flow-Steward/ext-email-smtp
listing:
  category: messaging
  tags:
  - email
  - smtp
  - notifications
  summary: |-
    Send text, HTML and template-based emails with workflow attachments through your project’s SMTP server.
  setup_summary: |-
    Create a custom SMTP project connection with host, supported port, SSL or STARTTLS and sender address; supply both username and secret password if authentication is required. Select that connection in Send Email steps or project notification routes and create saved templates if needed.
features:
- notify
- action
event_subscriptions:
- {event_type: job.failed, severity: any, conditions: {}}
- {event_type: job.completed, severity: any, conditions: {}}
- {event_type: job.awaiting_approval, severity: any, conditions: {}}
- {event_type: approval.requested, severity: any, conditions: {}}
- {event_type: approval.resolved, severity: any, conditions: {}}
- {event_type: notification.delivery.failed, severity: any, conditions: {}}
required_scopes:
- notify:dispatch
- extension:invoke
- artifact:read
machine_auth:
  service_account_key: svc_ext_outgoing_email
  required_scopes:
  - notify:dispatch
  - extension:invoke
  - artifact:read
schemas:
  config: schemas/config.schema.yaml
  secrets: schemas/secrets.schema.yaml
  subscriptions: schemas/subscriptions.schema.yaml
  input:
    type: object
    properties:
      action:
        type: string
      event:
        type: object
      route:
        type: object
      request:
        type: object
    required:
    - action
  output:
    type: object
    properties:
      ok:
        type: boolean
      delivered:
        type: boolean
      provider_message_id:
        type: string
      external_effect_status:
        type: string
    required:
    - ok
    - delivered
account_scope:
  scope_type: project
  description: SMTP bindings are per-project and use project connections for non-secret config and password storage.
# Where the extension connects: the SMTP host of the connection it sends with.
egress:
  connection_fields:
  - custom_smtp.host
external_effects:
- operation_id: send_email
  effect_kind: message_delivery
  channel: email
  idempotency: required
  test_mode_behavior: suppress
  observability:
    target_fields:
    - to
    - cc
    - bcc
    target_kind: recipient
    target_label: recipient
    artifact_field: attachments
    payload_size_field: estimated_message_bytes
  rate_limit:
    window_seconds: 60
    account_max: 60
    project_max: 30
    connection_max: 15
- operation_id: deliver_notification
  effect_kind: message_delivery
  channel: email
  idempotency: required
  test_mode_behavior: suppress
  observability:
    target_fields:
    - to
    - cc
    - bcc
    target_kind: recipient
    target_label: recipient
  rate_limit:
    window_seconds: 60
    account_max: 60
    project_max: 30
    connection_max: 15
project_state:
  reads:
  - namespace: templates
    state_key_from_input: template_id
    state_key_prefix: "template:"
runtime:
  contract_version: extension_host_v2
  extension_contract_v2:
    connection_types: contracts/connection_types.yaml
    operation_manifest: contracts/operation_manifest.yaml
    step_ui_manifest: contracts/step_ui_manifest.yaml
    artifact_policies: contracts/artifact_policies.yaml
artifact_policies:
- operation_id: send_email
  inputs:
  - kind: artifact
    value_type: artifact_handle
    binding_key: attachments
    from_input: attachments
    required: false
entrypoint:
  mode: subprocess
  command:
  - python3
  - main.py
health:
  command:
  - python3
  - health.py
  timeout_seconds: 5
ui_manifest: ui/ui_manifest.yaml
action_manifest: ui/actions/actions.yaml
python_requirements: []
