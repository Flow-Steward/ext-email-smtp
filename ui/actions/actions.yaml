actions:
- action_id: send_email
  title: "Send email via SMTP"
  description: "Send one plain-text, HTML or template-backed email through the selected SMTP connection. Create an SMTP server project connection with the host, port, security mode, sender address and any required login credentials, then select it for this step. Example: Email a generated PDF report to reports@example.com, mapping its artifact into an attachment descriptor."
  required_scopes:
  - extension:invoke
  - artifact:read
  handler:
    mode: extension
  mutates_platform: false
  workflow_visible: true
  parameters:
  - name: to
    type: string_or_array
    required: true
    description: Recipient email address or list of addresses.
  - name: cc
    type: string_or_array
    required: false
    description: "Optional visible copy recipients: email addresses separated by commas, or a mapped array."
  - name: bcc
    type: string_or_array
    required: false
    description: "Optional blind copy recipients: email addresses separated by commas, or a mapped array."
  - name: subject
    type: string
    required: false
    description: Required for a direct message; optional when the selected saved template provides its own subject.
  - name: body_text
    type: string
    required: false
  - name: body_html
    type: string
    required: false
    description: HTML email body; the plain-text alternative is made from it when body_text is not given.
  - name: template_id
    type: string
    required: false
    description: "ID of a saved project email template. Supply template variables and leave direct message bodies empty when using a template."
  - name: variables
    type: object
    required: false
    description: "JSON object mapping the selected template's placeholder names to values."
  - name: attachments
    type: artifact_list
    required: false
    description: "JSON array of workflow artifact descriptors, each with artifact_handle (or artifact_id or binding_key) and a safe filename. Use supported file types such as PDF; URLs, paths and inline content are not accepted."
  result_fields:
  - delivered
  - provider_message_id
  - recipient_count
  - attachment_count
  - estimated_message_bytes
  error_codes:
  - recipient_required
  - recipient_limit_exceeded
  - subject_required
  - body_required
  - body_source_ambiguous
  - template_not_found
  - template_variable_missing
  - attachment_source_invalid
  - attachment_type_disallowed
  - message_size_exceeded
  - smtp_recipients_partially_refused
  - smtp_send_failed
- action_id: deliver_notification
  title: Deliver Notification
  description: Send a project notification through SMTP.
  required_scopes:
  - notify:dispatch
  handler:
    mode: extension
  mutates_platform: false
  workflow_visible: false
  parameters:
  - name: event
    type: object
    required: true
  - name: route
    type: object
    required: true
  result_fields:
  - delivered
  - provider_message_id
  error_codes:
  - recipient_required
  - recipient_limit_exceeded
  - smtp_recipients_partially_refused
  - smtp_send_failed
