forms:
  - operation_id: send_email
    title: "Send email via SMTP"
    fields:
      - {name: to, label: To, widget_type: text, required: true, help_text: "Recipient address, comma-separated addresses, or a mapped JSON array of addresses.", placeholder: "reports@example.com"}
      - {name: cc, label: CC, widget_type: text, required: false, help_text: "Optional visible copy recipients: email addresses separated by commas, or a mapped array.", placeholder: "team@example.com"}
      - {name: bcc, label: BCC, widget_type: text, required: false, help_text: "Optional blind copy recipients: email addresses separated by commas, or a mapped array.", placeholder: "archive@example.com"}
      - {name: subject, label: Subject, widget_type: text, required: false, help_text: Required for a direct message; optional when the selected saved template provides its own subject.}
      - {name: body_text, label: Message, widget_type: textarea, required: false, help_text: Plain text. With an HTML message it is the text shown by clients that do not display HTML.}
      - {name: body_html, label: HTML message, widget_type: textarea, required: false, help_text: An HTML email body; a Template step in HTML format fits here. Without a plain Message the text version is made from it.}
      - {name: template_id, label: Template ID, widget_type: text, required: false, help_text: "ID of a saved project email template. Supply template variables and leave direct message bodies empty when using a template."}
      - {name: variables, label: Template variables, widget_type: json, required: false, help_text: "JSON object mapping the selected template's placeholder names to values.", placeholder: "{\"customer\":\"Alex\",\"order_id\":\"A-100\"}"}
      - {name: attachments, label: Attachments, widget_type: json, required: false, help_text: "JSON array of workflow artifact descriptors, each with artifact_handle (or artifact_id or binding_key) and a safe filename. Use supported file types such as PDF; URLs, paths and inline content are not accepted.", placeholder: "[{\"artifact_handle\":\"<map prior artifact handle>\",\"filename\":\"report.pdf\"}]"}
